services:

  philter-ui:
    build:
      context: .
    depends_on:
      philter:
        condition: service_started
    environment:
      PHILTER_URL: http://philter:8080
      PORT: "8081"
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      DOCUMENT_TIMEOUT_SECONDS: ${DOCUMENT_TIMEOUT_SECONDS:-300}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-0}
    ports:
      - "8081:8081"
    networks:
      - philter

  philter:
    image: philterd/philter:${PHILTER_VERSION:-4.0.0}
    environment:
      PASSWORD_SIGN_IN_ENABLED: "true"
      SSL_ENABLED: "false"
      STORAGE_TYPE: sqlite
      SQLITE_PATH: /opt/philter/data/philter.db
      PHILTER_ENCRYPTION_KEY: ${PHILTER_ENCRYPTION_KEY:?Generate it in .env; see Docker Compose in README.md}
      PHILTER_BOOTSTRAP_API_KEY: ${PHILTER_BOOTSTRAP_API_KEY:?Generate it in .env; see Docker Compose in README.md}
    volumes:
      - philter-data:/opt/philter/data
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - philter

volumes:
  philter-data:

networks:
  philter:
