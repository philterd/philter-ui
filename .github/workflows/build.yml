name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        # -U re-checks SNAPSHOT dependencies such as philter-sdk-java; without it, the cached ~/.m2 keeps the
        # snapshot already resolved that day, so a newer one published since is not used.
        run: mvn -B -U verify
