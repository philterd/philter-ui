# Beside Philter, which listens on 8080.
server.port=${PORT:8081}
spring.application.name=philter-ui
vaadin.launch-browser=false

# The Philter instance people sign in to and administer.
philter.url=${PHILTER_URL:https://localhost:8080}

# TLS for connecting to Philter, for a Philter behind a load balancer or service mesh that requires a client
# certificate, or with a certificate from a private certificate authority. Each is a PKCS12 or JKS file. With
# neither keystore set, the JDK's defaults apply, including -Djavax.net.ssl.trustStore.
philter.client-certificate=${PHILTER_CLIENT_CERTIFICATE:}
philter.client-certificate-password=${PHILTER_CLIENT_CERTIFICATE_PASSWORD:}
philter.trust-store=${PHILTER_TRUST_STORE:}
philter.trust-store-password=${PHILTER_TRUST_STORE_PASSWORD:}

# The reverse proxies in front of Philter UI, as comma-separated IP addresses and CIDR ranges. Philter UI
# believes X-Forwarded-For only from these when it passes a person's address to Philter with each request.
ui.trusted-proxies=${TRUSTED_PROXIES:}
# Off even where Spring Boot would turn it on (Kubernetes and other cloud platforms), where Tomcat would
# otherwise take the client address from X-Forwarded-For sent by any private address, whatever
# TRUSTED_PROXIES says.
server.forward-headers-strategy=none

# How long Philter may take to redact a PDF on the Dashboard before Philter UI gives up waiting.
philter.document-timeout-seconds=${DOCUMENT_TIMEOUT_SECONDS:300}

# The largest PDF the Dashboard accepts, in bytes. 0 uses Philter's own limit; a smaller value lowers it.
philter.max-pdf-bytes=${MAX_PDF_BYTES:0}

# Sign a person out after this long without interacting with Philter UI, and revoke the session key. With
# closeIdleSessions, heartbeats from an open tab do not count; IdleSessions ends the sign-in along with the
# Vaadin session, which would otherwise be kept alive by those heartbeats.
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:30}m
vaadin.closeIdleSessions=true
server.servlet.session.cookie.same-site=strict
